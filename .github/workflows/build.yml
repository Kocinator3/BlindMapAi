name: Quality and native artifacts
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
  native:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
          - os: ubuntu-24.04
            target: apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - if: matrix.target == 'linux'
        run: xvfb-run -a flutter test integration_test -d linux
      - uses: actions/upload-artifact@v4
        with:
          name: slepamapa-${{ matrix.target }}-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/linux/x64/release/bundle/
            build/windows/x64/runner/Release/
          if-no-files-found: error
