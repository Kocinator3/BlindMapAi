name: slepa_mapa
description: Offline geography practice and visual level authoring.
publish_to: none
version: 0.1.4+5
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  file_selector: ^1.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/maps/
    - assets/levels/
    - docs/level.schema.json
    - docs/CATALOG_TEXT_INSTRUCTIONS.md
    - docs/DATA_SOURCES.md
    - LICENSE
